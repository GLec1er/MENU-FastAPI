# Модульные и API-тесты. Значения подключения заданы здесь и не зависят от .env.
x-test-env: &test-env
  TEST_DATABASE_URL: postgresql://test:test@test_db:5432/menu_test
  TEST_ASYNC_DATABASE_URL: postgresql+asyncpg://test:test@test_db:5432/menu_test

services:
  test_app:
    container_name: "test_app"
    build:
      context: .
      dockerfile: Dockerfile
    environment: *test-env
    entrypoint: >
      sh -c "
        pytest -vv tests"
    networks:
      - test_network
    depends_on:
      redis:
        condition: service_healthy
      test_db:
        condition: service_healthy

  test_db:
    container_name: "test_db"
    image: postgres:15.1-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: menu_test
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U test -d menu_test" ]
      interval: 3s
      timeout: 5s
      retries: 30
    networks:
      - test_network

  redis:
    container_name: "redis"
    image: redis:7.0-alpine
    expose:
      - 6379
    networks:
      - test_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 20s
      retries: 20

networks:
  test_network:
    driver: bridge
